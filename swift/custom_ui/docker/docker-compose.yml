# MS-SWIFT Custom Web UI - Docker Compose Configuration
version: '3.8'

services:
  ms-swift-custom-ui:
    build:
      context: ../../..
      dockerfile: swift/custom_ui/docker/Dockerfile
    container_name: ms-swift-custom-ui
    image: ms-swift-custom-ui:latest

    # 端口映射
    ports:
      - "8000:8000"  # API 后端
      - "3000:3000"  # 前端 (可选)

    # 卷挂载
    volumes:
      # 数据目录
      - ./data:/app/data
      # 模型缓存
      - ./models:/app/models
      # 训练输出
      - ./output:/app/output
      # 日志
      - ./logs:/app/logs
      # ModelScope 缓存
      - ~/.cache/modelscope:/root/.cache/modelscope
      # Hugging Face 缓存
      - ~/.cache/huggingface:/root/.cache/huggingface

    # 环境变量
    environment:
      # CUDA 配置
      - CUDA_VISIBLE_DEVICES=0
      # API 配置
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # ModelScope 配置
      - MODELSCOPE_CACHE=/app/models
      # 日志级别
      - LOG_LEVEL=info

    # GPU 配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 重启策略
    restart: unless-stopped

    # 网络模式
    network_mode: bridge

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx 反向代理 (可选)
  # nginx:
  #   image: nginx:alpine
  #   container_name: ms-swift-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - ms-swift-custom-ui
  #   restart: unless-stopped

# 网络配置
networks:
  default:
    name: ms-swift-network

# 卷配置
volumes:
  data:
  models:
  output:
  logs:
