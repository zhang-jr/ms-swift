version: '3.8'

services:
  ms-swift-custom-ui:
    build:
      context: ../../..
      dockerfile: swift/custom_ui/docker/Dockerfile
    container_name: ms-swift-ui
    ports:
      - "${API_PORT:-8000}:8000"   # API 和前端访问端口
    volumes:
      # 挂载数据目录
      - ${DATA_DIR:-./data}:/app/data
      # 挂载模型目录
      - ${MODEL_DIR:-./models}:/app/models
      # 挂载输出目录
      - ${OUTPUT_DIR:-./output}:/app/output
      # 挂载数据集缓存目录（Apache Arrow 格式缓存）
      - ${DATASETS_CACHE_DIR:-./datasets_cache}:/app/datasets_cache
      # 挂载配置文件(可选)
      # - ./config:/app/config
    environment:
      # CUDA 设备配置（支持 0, 0,1, 0,1,2,3 等）
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      # Python 环境变量
      - PYTHONUNBUFFERED=1
      # 数据和模型目录（供后端 API 扫描）
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      # ModelScope 缓存目录
      - MODELSCOPE_CACHE=/app/models
      # HuggingFace 缓存目录
      - HF_HOME=/app/models
      # Datasets 库缓存目录（Apache Arrow 格式，与模型分离）
      - HF_DATASETS_CACHE=/app/datasets_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 支持: 1, 2, all 等
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    restart: unless-stopped
    stdin_open: true
    tty: true

